# Local development stack.
#
# This is NOT what runs in production: Ollama needs gigabytes of RAM and does
# not fit any free tier, so production uses AI_PROVIDER=groq instead
# (plan 004, D-01). The application code is identical; only the environment
# differs (Constitution, Principle VI).
services:
  api:
    build: .
    container_name: project_jackpot_api
    ports:
      - "9600:9600"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      PORT: 9600
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/project_jackpot_db
      AI_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: gemma3:1b
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  postgres:
    image: postgres:17
    container_name: project_jackpot_db
    environment:
      POSTGRES_DB: project_jackpot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Without this the API races the database and dies on first boot.
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_jackpot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: project_jackpot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "sleep 10 && ollama pull gemma3:1b"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
