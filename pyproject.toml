[project]
name = "project-roulette"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "httpx2>=2.3.0",
    "jpype1>=1.5.0",
    "ollama>=0.6.2",
    "openai>=2.43.0",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlmodel>=0.0.38",
    "strands-agents>=1.45.0",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Integration tests need live Postgres / Ollama, so they are opt-in.
# A suite that only passes when a daemon happens to be running is a broken
# suite (Constitution, Principle III). Run them with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requires live external services (Postgres, Ollama)",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "ty>=0.0.42",
]


[tool.ty.src]
exclude = [
    ".venv",
    "build",
    "dist",
    "alembic/versions",
    "tests/integration/test_postgres_health.py",
]
